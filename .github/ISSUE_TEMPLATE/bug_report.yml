name: Bug report
description: Report a defect in REDTEXT Generator
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Please do **not** include real engagement data,
        client names, or live target infrastructure in this report.
  - type: textarea
    id: command
    attributes:
      label: What you ran
      description: The full command or code snippet.
      placeholder: python -m redtext_generator phishing --industry finance --urgency high
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: Include the full traceback if there was one.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: REDTEXT version / commit
      placeholder: 2.1.0 or git SHA
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      description: Output of `python --version`
      placeholder: Python 3.11.4
    validations:
      required: true
