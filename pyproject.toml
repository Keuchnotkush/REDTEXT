[build-system]
# setuptools 77+ is Python 3.9+, so pinning that floor broke the 3.8 build.
# 64 is the lowest that supports dynamic `version = {attr = ...}` and is
# available for every interpreter in the support matrix (3.8+).
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "redtext-generator"
dynamic = ["version"]
description = "Social Engineering Scenario Builder for Authorized Red Team Operations"
readme = "README.md"
# Classic table form (not the PEP 639 SPDX string): the SPDX `license = "..."`
# string needs setuptools 77+, which is Python 3.9+. This form plus the
# classifier below keeps the build working all the way back to Python 3.8.
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.8"
authors = [{ name = "keuchnotkush" }]
keywords = [
    "social-engineering",
    "red-team",
    "penetration-testing",
    "cybersecurity",
    "security-awareness",
    "mitre-attack",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/keuchnotkush/redtext-generator"
Repository = "https://github.com/keuchnotkush/redtext-generator"
Issues = "https://github.com/keuchnotkush/redtext-generator/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
redtext-gen = "redtext_generator.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "redtext_generator.__version__" }

[tool.setuptools.packages.find]
include = ["redtext_generator*"]

[tool.ruff]
target-version = "py38"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# E501: line length is not enforced (long template strings are intentional).
# E701: compound one-line statements are used deliberately for terse dispatch.
ignore = ["E501", "E701"]

[tool.pytest.ini_options]
testpaths = ["tests"]
